# Configuração do projeto FORNEX no Supabase (projeto "fronex").
# Espelha o projeto remoto: aplicar com
#   npx supabase config push --remote=tfqqyskomsnmenpbgaiz
project_id = "fornex"

[auth]
site_url = "https://fornex-five.vercel.app"
additional_redirect_urls = ["https://fornex-five.vercel.app/**", "http://localhost:5173/**"]

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

# E-mails em português com a marca FORNEX (supabase/templates).
# Os links apontam para /auth/confirmar (token_hash), que funciona em qualquer aparelho.
[auth.email.template.confirmation]
subject = "Confirme seu e-mail na FORNEX"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefina sua senha da FORNEX"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirme seu novo e-mail na FORNEX"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.magic_link]
subject = "Seu link de acesso à FORNEX"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "Você foi convidado para a FORNEX"
content_path = "./supabase/templates/invite.html"

[auth.email.template.reauthentication]
subject = "Seu código de verificação FORNEX"
content_path = "./supabase/templates/reauthentication.html"

[auth.sms]
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.vector]
enabled = false

# Chamado pelo gateway de pagamento: a autenticidade é validada pela assinatura.
[functions.mercadopago-webhook]
verify_jwt = false

# Chamado pelos fornecedores: autenticado pelo header x-webhook-secret.
[functions.integration-webhook]
verify_jwt = false

# Notificações do Mercado Livre (lojas dos clientes). O recurso é sempre reconsultado na API do ML.
[functions.ml-webhook]
verify_jwt = false
